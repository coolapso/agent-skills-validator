# Integration test for the composite action: runs the published action
# (`uses: ./`) against the fixtures on Linux, macOS and Windows. It downloads a
# released binary, so it only runs once at least one release exists.
name: Action integration

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - action.yaml
      - site/install.sh
      - .github/workflows/action-test.yaml
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  latest-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "latest release: '${version:-none}'"

  action:
    name: action (${{ matrix.os }})
    needs: latest-release
    if: needs.latest-release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Valid skill passes
        uses: ./
        with:
          version: ${{ needs.latest-release.outputs.version }}
          path: internal/validator/testdata/valid/full
          strict: true
          fail-on-warnings: true

      - name: Invalid skill fails with exit code 1 and JSON output
        id: invalid
        uses: ./
        continue-on-error: true
        with:
          version: ${{ needs.latest-release.outputs.version }}
          path: internal/validator/testdata/invalid/as004-mismatch
          format: json

      - name: Assert the invalid run
        shell: bash
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          EXIT_CODE: ${{ steps.invalid.outputs.exit-code }}
          JSON_FILE: ${{ steps.invalid.outputs.json-file }}
          JSON: ${{ steps.invalid.outputs.json }}
        run: |
          test "$OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"
          test -s "$JSON_FILE"
          python3 -c "import json,os; d=json.loads(os.environ['JSON']); assert d['skills'][0]['diagnostics'][0]['rule']=='AS004'"

      - name: Several directories and a glob in one run with matrix false
        id: many
        uses: ./
        continue-on-error: true
        with:
          version: ${{ needs.latest-release.outputs.version }}
          matrix: false
          path: |
            internal/validator/testdata/valid/*/
            internal/validator/testdata/invalid/as004-mismatch
          format: json

      - name: Assert the multi-path run
        shell: bash
        env:
          OUTCOME: ${{ steps.many.outcome }}
          EXIT_CODE: ${{ steps.many.outputs.exit-code }}
          JSON: ${{ steps.many.outputs.json }}
        run: |
          test "$OUTCOME" = "failure"
          test "$EXIT_CODE" = "1"
          python3 - <<'EOF'
          import json, os
          report = json.loads(os.environ["JSON"])
          paths = [s["path"] for s in report["skills"]]
          assert "internal/validator/testdata/valid/full" in paths, paths
          assert paths[-1] == "internal/validator/testdata/invalid/as004-mismatch", paths
          assert not any(p.endswith("/") for p in paths), paths
          assert sum(1 for s in report["skills"] if not s["valid"]) == 1, paths
          EOF

      - name: Several directories with matrix true are misuse
        id: many-matrix
        uses: ./
        continue-on-error: true
        with:
          version: ${{ needs.latest-release.outputs.version }}
          path: |
            internal/validator/testdata/valid/full
            internal/validator/testdata/valid/bom

      - name: A glob that matches nothing is misuse
        id: nomatch
        uses: ./
        continue-on-error: true
        with:
          version: ${{ needs.latest-release.outputs.version }}
          matrix: false
          path: internal/validator/testdata/does-not-exist/*/

      - name: Assert the misuse runs
        shell: bash
        run: |
          test "${{ steps.many-matrix.outcome }}" = "failure"
          test "${{ steps.nomatch.outcome }}" = "failure"

      - name: Warning becomes failure with strict
        id: strict
        uses: ./
        continue-on-error: true
        with:
          version: ${{ needs.latest-release.outputs.version }}
          path: internal/validator/testdata/warn/as010-long
          strict: true

      - name: Assert the strict run
        shell: bash
        run: test "${{ steps.strict.outcome }}" = "failure"
