name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: task fmt:check

      - name: go vet
        run: task vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Unit tests
        run: task test

      - name: Fixture smoke test
        run: task fixtures:smoke

      - name: shellcheck
        run: task shellcheck

      - name: Container image builds and runs
        run: task container:smoke

      - name: GoReleaser config check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check

  cross-platform:
    name: fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Build
        run: go build -o agent-skills-validator${{ runner.os == 'Windows' && '.exe' || '' }} .

      - name: Valid fixtures exit 0
        shell: bash
        run: ./agent-skills-validator validate internal/validator/testdata/valid/*/

      - name: Invalid fixtures exit 1
        shell: bash
        run: |
          set +e
          ./agent-skills-validator validate --format json internal/validator/testdata/invalid/*/ > report.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 -c "import json,sys; d=json.load(open('report.json')); assert d['version']==1 and all(not s['valid'] for s in d['skills'])"

      - name: Warning fixture exits 0, then 1 with --fail-on-warnings
        shell: bash
        run: |
          ./agent-skills-validator validate internal/validator/testdata/warn/as010-long
          set +e
          ./agent-skills-validator validate --fail-on-warnings internal/validator/testdata/warn/as010-long
          test $? -eq 1

  check-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: coolapso/convcommitlint@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
