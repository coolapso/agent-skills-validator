name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tests:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest
    concurrency:
      group: semrel-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install release tooling
        run: |
          task tools:install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Taskfile is the single release path: semrel pins the action's CLI
      # version, tags, and creates the GitHub release; GoReleaser then attaches
      # the artifacts, the floating major tag is moved, and the multi-arch
      # container images are pushed to GHCR.
      - name: Release
        run: task release:ci
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMREL_PLUGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}

  action-integration:
    needs: release
    uses: ./.github/workflows/action-test.yaml
    permissions:
      contents: read
