name: Release

on:
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  release:
    needs: tests
    runs-on: ubuntu-latest
    concurrency:
      group: semrel-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write # Infisical OIDC auth
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install release tooling
        run: |
          task tools:install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          domain: "https://eu.infisical.com"
          method: "oidc"
          env-slug: "ci"
          project-slug: "cicd"
          identity-id: "4d6a4fd3-8b48-4eab-86a9-37d87de683e0"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Taskfile is the single release path: semrel pins the action's CLI
      # version, tags, and creates the GitHub release; GoReleaser then attaches
      # the artifacts, the floating major tag is moved, and the multi-arch
      # container images are pushed to GHCR and Docker Hub.
      - name: Release
        run: task release:ci
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMREL_PLUGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Everything below comes from Infisical (project cicd, env ci); no
          # repository secrets are configured. The built-in GITHUB_TOKEN is
          # enough for GHCR.
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ env.dockerhub }}
          AUR_KEY: ${{ env.aur }}
          DISCORD_WEBHOOK_ID: ${{ env.discord_webhook_id }}
          DISCORD_WEBHOOK_TOKEN: ${{ env.discord_webhook_token }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: coolapso
          password: ${{ env.dockerhub }}
          repository: coolapso/agent-skills-validator

  action-integration:
    needs: release
    uses: ./.github/workflows/action-test.yaml
    permissions:
      contents: read
